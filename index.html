<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Navv</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icon.svg">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => {
              console.log('Service Worker registered!');
              // Force check for sw.js updates bypassing HTTP cache limit
              reg.update();
            })
            .catch(err => console.error('Service Worker registration failed', err));

          // Force reload when a new Service Worker takes control
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --danger: #EF4444;
            --bg-glass: rgba(255, 255, 255, 0.8);
            --bg-solid: #ffffff;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: rgba(0, 0, 0, 0.08);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --blur: blur(20px);
        }

        body.dark-theme {
            --bg-glass: rgba(24, 24, 27, 0.8);
            --bg-solid: #18181b;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-solid); 
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent; 
            overflow: hidden;
            transition: background 0.3s ease;
        }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        .glass {
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        /* Top HUD */
        .ui-top {
            position: fixed; top: env(safe-area-inset-top, 20px); left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            z-index: 2000; pointer-events: none;
        }
        .ui-top > * { pointer-events: auto; }

        .install-banner {
            padding: 12px 20px; border-radius: 99px; font-size: 13px; font-weight: 600;
            display: none; align-items: center; gap: 12px;
        }

        /* Unified Bottom Capsule */
        .ui-bottom {
            position: fixed; bottom: max(24px, env(safe-area-inset-bottom, 24px)); left: 50%;
            transform: translateX(-50%); width: 92%; max-width: 440px;
            display: flex; flex-direction: column; gap: 12px;
            z-index: 1000; transition: bottom 0.4s ease;
        }

        .control-capsule {
            display: flex; align-items: center; padding: 6px; border-radius: 99px;
        }

        .icon-btn {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            background: transparent; color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; transition: all 0.2s;
            flex-shrink: 0; padding: 0; margin: 0; box-sizing: border-box;
        }
        .icon-btn:active { transform: scale(0.9); background: rgba(128,128,128,0.1); }
        .icon-btn.active { color: var(--primary); }

        .search-input {
            flex: 1; border: none; background: transparent; outline: none;
            padding: 0 12px; font-family: inherit; font-size: 16px;
            font-weight: 500; color: var(--text-main); min-width: 0;
            height: 44px; margin: 0; box-sizing: border-box;
        }

        .search-results {
            position: absolute; bottom: calc(100% + 12px); left: 0; width: 100%; max-height: 300px;
            border-radius: 24px; overflow-y: auto; display: none;
        }
        .result-item {
            padding: 14px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px; cursor: pointer;
        }
        .result-item:last-child { border-bottom: none; }

        /* Bottom Sheet */
        .bottom-sheet {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1500;
            border-radius: 32px 32px 0 0; transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 12px 24px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box;
        }
        .handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }

        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .main-btn {
            flex: 1; padding: 16px; border: none; border-radius: 18px;
            font-weight: 700; font-size: 15px; cursor: pointer; transition: opacity 0.2s;
        }
        .main-btn:active { opacity: 0.7; }

        /* Animations */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinning { animation: spin 1s linear infinite; }
        @keyframes marching-ants { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
        .route-path-animated { animation: marching-ants 1s linear infinite; }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-solid); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="light-theme">
    <div id="loading">
        <div style="width:40px; height:40px; border:4px solid var(--border); border-top-color:var(--primary); border-radius:50%;" class="spinning"></div>
    </div>

    <div id="map"></div>

    <div class="ui-top">
        <div id="install-prompt" class="glass install-banner">
            <span id="install-text">Install Navv for the best experience</span>
            <button id="install-button" style="background:var(--primary); color:white; border:none; padding:6px 16px; border-radius:20px; font-weight:700; font-size:12px;">Install</button>
            <button id="install-close" style="background:transparent; border:none; color:var(--text-muted); font-size:18px;">✕</button>
        </div>
        <div id="offline-indicator" class="glass" style="padding:10px 20px; border-radius:99px; color:var(--danger); font-weight:700; font-size:13px; display:none;">⚠️ Offline</div>
        <div id="toast" class="glass" style="padding:12px 24px; border-radius:99px; font-weight:600; font-size:14px; opacity:0; transition:opacity 0.3s;">Notification</div>
        <div id="nav-banner" class="glass" style="width:90%; max-width:350px; padding:16px; border-radius:24px; display:none; align-items:center; gap:16px;">
            <div id="nav-arrow" style="font-size:32px;">⬆️</div>
            <div style="flex:1; min-width:0;">
                <div id="nav-distance" style="font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase;">...</div>
                <div id="nav-instruction" style="font-size:17px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">...</div>
            </div>
        </div>
    </div>

    <div class="ui-bottom" id="bottom-hud">
        <div style="position:relative; width:100%;">
            <div class="glass search-results" id="search-results"></div>
            <div class="glass control-capsule">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">🌙</button>
                <input type="text" id="search-input" class="search-input" placeholder="Search campus...">
                <button id="gps-button" class="icon-btn" aria-label="Center location">
                    <svg id="gps-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="6"></circle>
                        <line x1="12" y1="2" x2="12" y2="6"></line>
                        <line x1="12" y1="18" x2="12" y2="22"></line>
                        <line x1="2" y1="12" x2="6" y2="12"></line>
                        <line x1="18" y1="12" x2="22" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="route-card" class="glass bottom-sheet">
        <div class="handle"></div>
        <h2 id="route-dest-name" style="font-size:22px; font-weight:800; margin:0;">Destination</h2>
        <p id="route-distance" style="color:var(--text-muted); font-weight:600; font-size:14px; margin:4px 0 0 0;">Calculating...</p>
        <div class="btn-row">
            <button id="alt-route-btn" class="main-btn" style="background:var(--primary); color:white;">Alternate</button>
            <button id="cancel-route-btn" class="main-btn" style="background:rgba(128,128,128,0.1); color:var(--text-main);">End</button>
        </div>
    </div>

    <script>
        let campusData = null;
        let map, userMarker, userLocation, watchId, currentHeading, currentDestination, currentDestinationName, destinationMarker, currentRoutePolyline, currentRoutePath = [], currentPathIds = [], isFollowing = false, toastTimeout, campusBounds, userHeading = null, lastLoc = null, firstPos = true;
        let blockedNodeIds = new Set();
        let isCalculatingRoute = false;

        // --- THEME LOGIC ---
        function applyTheme(theme) {
            const body = document.body;
            const toggle = document.getElementById('theme-toggle');
            const sunIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
            const moonIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
            
            if (theme === 'dark') {
                body.classList.add('dark-theme');
                body.classList.remove('light-theme');
                toggle.innerHTML = sunIcon;
            } else {
                body.classList.add('light-theme');
                body.classList.remove('dark-theme');
                toggle.innerHTML = moonIcon;
            }
            localStorage.setItem('theme', theme);
        }

        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(savedTheme);

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const current = document.body.classList.contains('dark-theme') ? 'light' : 'dark';
            applyTheme(current);
        });

        // --- PWA INSTALL LOGIC ---
        let deferredPrompt;
        const installBanner = document.getElementById('install-prompt');
        const installBtn = document.getElementById('install-button');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') console.log('User accepted install');
                deferredPrompt = null;
                installBanner.style.display = 'none';
            } else {
                // Manual instruction for iOS
                showToast("Tap Share -> Add to Home Screen to install.");
            }
        });

        document.getElementById('install-close').addEventListener('click', () => { installBanner.style.display = 'none'; });

        // Detection for iOS Safari
        const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
        const isStandalone = window.navigator.standalone === true;
        if (isIos && !isStandalone) {
            document.getElementById('install-text').textContent = "Install Navv for offline use";
            installBanner.style.display = 'flex';
        }

        // --- ROUTING LOGIC ---
        class PriorityQueue {
            constructor() { this.elements = []; }
            enqueue(element, priority) {
                this.elements.push({element, priority});
                this.elements.sort((a, b) => a.priority - b.priority);
            }
            dequeue() { return this.elements.shift().element; }
            isEmpty() { return this.elements.length === 0; }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // IndexedDB logic remains same
        const DB_NAME = 'Navv_Map_DB', DB_VERSION = 4, STORE_NAME = 'campusData';
        async function initDB() { return new Promise((res, rej) => { const req = indexedDB.open(DB_NAME, DB_VERSION); req.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME); }; req.onsuccess = (e) => res(e.target.result); req.onerror = (e) => rej(e.target.error); }); }
        async function getCachedData() { const db = await initDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE_NAME, 'readonly'); const store = tx.objectStore(STORE_NAME); const req = store.get('navv_data'); req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
        async function saveToCache(data) { const db = await initDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE_NAME, 'readwrite'); const store = tx.objectStore(STORE_NAME); const req = store.put({ data, timestamp: Date.now() }, 'navv_data'); req.onsuccess = () => res(); req.onerror = () => rej(req.error); }); }

        async function fetchFromOverpass() {
            const query = `[out:json][timeout:900]; area["name"="Indian Institute of Technology - Madras"]->.iitm; (node(area.iitm); way(area.iitm); relation(area.iitm); relation["name"="Indian Institute of Technology - Madras"]; way["name"="Indian Institute of Technology - Madras"]; ); out geom;`;
            const res = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: "data=" + encodeURIComponent(query), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
            if (!res.ok) throw new Error('Overpass fail');
            return await res.json();
        }

        function processOSMData(osmData) {
            const data = { buildings: [], graph: { nodes: {}, edges: {} }, boundary: null };
            const allNodes = {};
            osmData.elements.forEach(el => { if (el.type === 'node') allNodes[el.id] = [el.lat, el.lon]; });
            osmData.elements.forEach(el => {
                const tags = el.tags || {};
                if (tags.name === 'Indian Institute of Technology - Madras' || tags.name === 'Indian Institute of Technology Madras') {
                    let coords = [];
                    if (el.type === 'way' && el.geometry) coords = el.geometry.map(p => [p.lon, p.lat]);
                    else if (el.type === 'relation' && el.members) el.members.forEach(m => { if (m.role === 'outer' && m.geometry) coords.push(...m.geometry.map(p => [p.lon, p.lat])); });
                    if (coords.length > 0) data.boundary = { type: 'Polygon', coordinates: [coords] };
                }
                const isPOI = tags.name && (tags.building || tags.amenity || tags.leisure || tags.shop || tags.tourism);
                const getAliases = (t) => { const a = []; if (t.alt_name) a.push(t.alt_name); if (t.short_name) a.push(t.short_name); if (t['name:en']) a.push(t['name:en']); return a; };
                if (el.type === 'node' && isPOI) data.buildings.push({ id: el.id, name: tags.name, lat: el.lat, lon: el.lon, aliases: getAliases(tags), type: tags.building || tags.amenity || tags.leisure || 'POI' });
                else if (el.type === 'way') {
                    if (tags.highway) {
                        for (let i = 0; i < el.nodes.length; i++) {
                            const nid = el.nodes[i], coords = el.geometry ? [el.geometry[i].lon, el.geometry[i].lat] : (allNodes[nid] ? [allNodes[nid][1], allNodes[nid][0]] : null);
                            if (!coords) continue;
                            if (!data.graph.nodes[nid]) data.graph.nodes[nid] = coords;
                            if (i > 0) {
                                const prevNid = el.nodes[i - 1], prevCoords = el.geometry ? [el.geometry[i-1].lon, el.geometry[i-1].lat] : (allNodes[prevNid] ? [allNodes[prevNid][1], allNodes[prevNid][0]] : null);
                                if (prevCoords) { const dist = getDistance(coords[1], coords[0], prevCoords[1], prevCoords[0]); if (!data.graph.edges[nid]) data.graph.edges[nid] = {}; if (!data.graph.edges[prevNid]) data.graph.edges[prevNid] = {}; data.graph.edges[nid][prevNid] = dist; data.graph.edges[prevNid][nid] = dist; }
                            }
                        }
                    }
                    if (isPOI) {
                        let lat = 0, lon = 0, count = 0;
                        if (el.geometry) el.geometry.forEach(p => { lat += p.lat; lon += p.lon; count++; });
                        if (count > 0) data.buildings.push({ id: el.id, name: tags.name, lat: lat / count, lon: lon / count, aliases: getAliases(tags), type: tags.building || tags.amenity || tags.leisure || 'POI', nodes: el.nodes || [] });
                    }
                } else if (el.type === 'relation' && isPOI) {
                    let lat = 0, lon = 0, count = 0;
                    el.members.forEach(m => { if (m.type === 'way' && m.geometry) m.geometry.forEach(p => { lat += p.lat; lon += p.lon; count++; }); });
                    if (count > 0) data.buildings.push({ id: el.id, name: tags.name, lat: lat / count, lon: lon / count, aliases: getAliases(tags), type: tags.building || tags.amenity || tags.leisure || 'POI' });
                }
            });

            // Virtual nodes and connections
            data.buildings.forEach(b => {
                const bNodeId = `b_${b.id}`; data.graph.nodes[bNodeId] = [b.lon, b.lat];
                if (!data.graph.edges[bNodeId]) data.graph.edges[bNodeId] = {};
                let connected = false;
                if (b.nodes) b.nodes.forEach(nid => { if (data.graph.nodes[nid]) { data.graph.edges[bNodeId][nid] = 0; if (!data.graph.edges[nid]) data.graph.edges[nid] = {}; data.graph.edges[nid][bNodeId] = 0; connected = true; } });
                if (!connected) {
                    let nearestId = null, minDist = Infinity;
                    for (const [nid, coords] of Object.entries(data.graph.nodes)) { if (nid.startsWith('b_')) continue; const d = getDistance(b.lat, b.lon, coords[1], coords[0]); if (d < minDist) { minDist = d; nearestId = nid; } }
                    if (nearestId) { data.graph.edges[bNodeId][nearestId] = 0; if (!data.graph.edges[nearestId]) data.graph.edges[nearestId] = {}; data.graph.edges[nearestId][bNodeId] = 0; }
                }
            });
            return data;
        }

        async function loadApp() {
            try {
                const cached = await getCachedData();
                if (cached && (Date.now() - cached.timestamp < 90 * 24 * 60 * 60 * 1000)) campusData = cached.data;
                else if (!navigator.onLine && cached) campusData = cached.data;
                else { const osm = await fetchFromOverpass(); campusData = processOSMData(osm); await saveToCache(campusData); if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type: 'REFRESH_TILES' }); }
                initMap();
            } catch (err) {
                console.error(err);
                const cached = await getCachedData();
                if (cached) { campusData = cached.data; initMap(); }
                else alert('Failed to load map data. Check connection.');
            }
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, minZoom: 13, maxZoom: 22 }).setView([12.9914, 80.2337], 17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM', maxNativeZoom: 19, maxZoom: 22 }).addTo(map);
            map.on('dragstart', () => { isFollowing = false; updateGPSUI(); });

            const worldCoords = [[90, -180], [90, 180], [-90, 180], [-90, -180]];
            let campusBoundaryCoords = [];
            if (campusData.boundary && campusData.boundary.coordinates) {
                const rawCoords = campusData.boundary.type === 'MultiPolygon' ? campusData.boundary.coordinates[0][0] : campusData.boundary.coordinates[0];
                campusBoundaryCoords = rawCoords.map(coord => [coord[1], coord[0]]);
            }
            if (campusBoundaryCoords.length > 0) {
                L.polygon([worldCoords, campusBoundaryCoords], { color: '#2c3e50', fillColor: '#000', fillOpacity: 0.7, weight: 3 }).addTo(map);
                campusBounds = L.latLngBounds(campusBoundaryCoords);
                map.setMaxBounds(campusBounds.pad(0.5));
                map.options.maxBoundsViscosity = 0.8;
            }
            
            map.whenReady(() => { setTimeout(() => { const loading = document.getElementById('loading'); if (loading) { loading.style.opacity = '0'; setTimeout(() => loading.remove(), 500); } }, 500); });

            setupUI();
            setupGeolocation();
        }

        function setupUI() {
            const offlineIndicator = document.getElementById('offline-indicator');
            const updateStatus = () => { offlineIndicator.style.display = navigator.onLine ? 'none' : 'block'; };
            window.addEventListener('online', updateStatus); window.addEventListener('offline', updateStatus);
            updateStatus();

            const searchInput = document.getElementById('search-input'), results = document.getElementById('search-results'), clear = document.getElementById('search-clear');
            
            searchInput.addEventListener('input', (e) => {
                const raw = e.target.value;
                const q = raw.toLowerCase().replace(/[^a-z0-9]/g, '');
                results.innerHTML = '';
                if (q.length < 2) { results.style.display = 'none'; return; }
                const matches = campusData.buildings.filter(b => {
                    const name = b.name.toLowerCase().replace(/[^a-z0-9]/g, ''), type = (b.type || '').toLowerCase();
                    return name.includes(q) || type.includes(q) || (b.aliases && b.aliases.some(a => a.toLowerCase().includes(q)));
                }).slice(0, 10);
                
                results.style.display = 'block';
                if (matches.length > 0) {
                    matches.forEach(m => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        let icon = '📍';
                        if (m.type.includes('food') || m.type.includes('cafe')) icon = '☕';
                        else if (m.type.includes('lib')) icon = '📚';
                        else if (m.type.includes('hostel')) icon = '🏠';
                        div.innerHTML = `<span style="font-size:18px;">${icon}</span><div style="flex:1;"><strong style="display:block; font-size:15px;">${m.name}</strong><small class="text-muted" style="text-transform:capitalize;">${m.type.replace(/_/g,' ')}</small></div>`;
                        div.onclick = () => { searchInput.value = m.name; results.style.display = 'none'; setDestination([m.lat, m.lon], m.name); };
                        results.appendChild(div);
                    });
                } else { results.innerHTML = '<div style="padding:20px; text-align:center;" class="text-muted">No results found</div>'; }
            });

            map.on('click', () => { results.style.display = 'none'; searchInput.blur(); });

            document.getElementById('alt-route-btn').onclick = async () => {
                if (isCalculatingRoute) return;
                if (currentPathIds.length < 2) { showToast("No alternate available"); return; }
                
                isCalculatingRoute = true;
                const nodeToBlock = currentPathIds[1];
                if (typeof nodeToBlock === 'string' && nodeToBlock.startsWith('b_')) { showToast("Destination reached soon"); isCalculatingRoute = false; return; }
                
                blockedNodeIds.add(nodeToBlock);
                const hasAlt = await tryFindAlternate();
                
                if (hasAlt) {
                    calculateAndDrawRoute(userLocation, currentDestination, currentDestinationName);
                } else {
                    blockedNodeIds.delete(nodeToBlock);
                    if (blockedNodeIds.size > 0) {
                        showToast("Resetting routes...");
                        blockedNodeIds.clear();
                        calculateAndDrawRoute(userLocation, currentDestination, currentDestinationName);
                    } else {
                        showToast("No more alternate routes");
                    }
                }
                isCalculatingRoute = false;
            };

            async function tryFindAlternate() {
                const startNodes = getNearestNodes(userLocation[0], userLocation[1], 3);
                const endNodes = getNearestNodes(currentDestination[0], currentDestination[1], 1);
                for (const s of startNodes) {
                    for (const e of endNodes) {
                        if (dijkstra(s, e, blockedNodeIds)) return true;
                    }
                }
                return false;
            }

            document.getElementById('cancel-route-btn').onclick = () => {
                if (currentRoutePolyline) map.removeLayer(currentRoutePolyline);
                if (destinationMarker) map.removeLayer(destinationMarker);
                currentDestination = null; blockedNodeIds.clear();
                document.getElementById('route-card').style.transform = 'translateY(100%)';
                document.getElementById('bottom-hud').style.bottom = 'max(24px, env(safe-area-inset-bottom, 24px))';
                document.getElementById('nav-banner').style.display = 'none';
                currentPathIds = []; currentRoutePath = []; isFollowing = false;
                updateGPSUI();
                if (userLocation) map.flyTo(userLocation, 17);
            };
        }

        const blueDotIcon = L.divIcon({ 
            className: 'user-dot', 
            html: `
                <div style="position:relative; width:40px; height:40px;">
                    <div id="user-arrow" style="position:absolute; top:50%; left:50%; width:24px; height:24px; margin-left:-12px; margin-top:-24px; transform-origin: 50% 100%; transition: transform 0.3s; display:none; z-index:0;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--primary)" opacity="0.8">
                            <path d="M12 2L22 22L12 18L2 22Z"/>
                        </svg>
                    </div>
                    <div style="position:absolute; top:50%; left:50%; width:14px; height:14px; margin-left:-10px; margin-top:-10px; background:var(--primary); border:3px solid white; border-radius:50%; box-shadow:0 0 0 4px rgba(79,70,229,0.3); z-index:1; box-sizing: content-box;"></div>
                </div>`, 
            iconSize: [40, 40], 
            iconAnchor: [20, 20] 
        });

        function updateGPSUI() {
            const btn = document.getElementById('gps-button'), icon = document.getElementById('gps-icon');
            if (isFollowing) btn.classList.add('active'); else btn.classList.remove('active');
        }

        function setupGeolocation() {
            const gpsBtn = document.getElementById('gps-button');
            const handlePos = (pos) => {
                const lat = pos.coords.latitude, lon = pos.coords.longitude;
                if (lastLoc) if (getDistance(lastLoc[0], lastLoc[1], lat, lon) > 2) userHeading = getBearing(lastLoc[0], lastLoc[1], lat, lon);
                lastLoc = [lat, lon];
                if (campusBounds && !campusBounds.contains([lat, lon])) return;
                userLocation = [lat, lon];
                if (!userMarker) { userMarker = L.marker(userLocation, { icon: blueDotIcon }).addTo(map); if (firstPos) map.setView(userLocation, 18); }
                else { userMarker.setLatLng(userLocation); if (isFollowing) map.panTo(userLocation); }
                firstPos = false;
                if (currentDestination) {
                    if (currentRoutePath.length === 0) calculateAndDrawRoute(userLocation, currentDestination, currentDestinationName);
                    else {
                        let minDist = Infinity;
                        for (let i = 0; i < currentRoutePath.length - 1; i++) minDist = Math.min(minDist, getDistanceToSegment(lat, lon, currentRoutePath[i][0], currentRoutePath[i][1], currentRoutePath[i+1][0], currentRoutePath[i+1][1]));
                        if (minDist > 20) calculateAndDrawRoute(userLocation, currentDestination, currentDestinationName);
                        else updateNavBanner(lat, lon);
                    }
                }
            };
            
            const start = () => navigator.geolocation.watchPosition(handlePos, (e) => { if (e.code !== 3) showToast("GPS error"); }, { enableHighAccuracy: true, maximumAge: 0 });
            watchId = start();
            gpsBtn.onclick = () => { 
                isFollowing = true; updateGPSUI(); 
                if (userLocation) map.flyTo(userLocation, 18);
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission().then(s => { if (s==='granted') window.addEventListener('deviceorientationabsolute', onOrient, true); });
                else window.addEventListener('deviceorientationabsolute', onOrient, true);
            };
        }

        function onOrient(e) {
            let h = e.webkitCompassHeading !== undefined ? e.webkitCompassHeading : (e.absolute && e.alpha !== null ? (360 - e.alpha) % 360 : null);
            if (h !== null) { const el = document.getElementById('user-arrow'); el.style.transform = `rotate(${h}deg)`; el.style.display = 'block'; }
        }

        function getNearestNodes(lat, lon, count) { let n = []; for (const [id, c] of Object.entries(campusData.graph.nodes)) n.push({id, d: getDistance(lat, lon, c[1], c[0])}); return n.sort((a,b)=>a.d-b.d).slice(0, count).map(x=>x.id); }

        function dijkstra(startId, endId, blocked = new Set()) {
            const graph = campusData.graph.edges, dists = {}, prev = {}, pq = new PriorityQueue();
            for (const n in campusData.graph.nodes) { dists[n] = Infinity; prev[n] = null; }
            if (!(startId in dists)) return null;
            dists[startId] = 0; pq.enqueue(startId, 0);
            while (!pq.isEmpty()) {
                const u = pq.dequeue(); if (u === endId) break;
                if (graph[u]) for (const v in graph[u]) { if (blocked.has(v)) continue; const d = dists[u] + graph[u][v]; if (d < dists[v]) { dists[v] = d; prev[v] = u; pq.enqueue(v, d); } }
            }
            const p = []; let curr = endId; while (curr) { p.unshift(curr); curr = prev[curr]; }
            return p[0] === startId ? p : null;
        }

        function setDestination(latLng, name) {
            currentDestination = latLng; currentDestinationName = name; blockedNodeIds.clear();
            if (destinationMarker) map.removeLayer(destinationMarker);
            destinationMarker = L.marker(latLng, { icon: L.divIcon({ className: 'dest', html: '<div style="font-size:32px; transform:translate(-50%,-100%);">🎯</div>' }) }).addTo(map);
            map.flyTo(latLng, 17);
            if (userLocation) calculateAndDrawRoute(userLocation, latLng, name);
            else showToast("Awaiting GPS...");
        }

        function calculateAndDrawRoute(start, end, name) {
            if (currentRoutePolyline) map.removeLayer(currentRoutePolyline);
            const sNodes = getNearestNodes(start[0], start[1], 5), eNodes = getNearestNodes(end[0], end[1], 1);
            let pIds = null; for (const s of sNodes) { for (const e of eNodes) { pIds = dijkstra(s, e, blockedNodeIds); if (pIds) break; } if (pIds) break; }
            if (pIds) {
                currentPathIds = pIds; const lls = pIds.map(id => [campusData.graph.nodes[id][1], campusData.graph.nodes[id][0]]);
                lls.unshift(start); lls.push(end); currentRoutePath = lls;
                currentRoutePolyline = L.polyline(lls, { color: 'var(--primary)', weight: 6, opacity: 0.9, dashArray: '12, 12', className: 'route-path-animated' }).addTo(map);
                let d = 0; for (let i=0; i<lls.length-1; i++) d += getDistance(lls[i][0], lls[i][1], lls[i+1][0], lls[i+1][1]);
                document.getElementById('route-dest-name').textContent = name;
                document.getElementById('route-distance').textContent = `${Math.round(d)}m • ${Math.ceil(d/80)} min walk`;
                document.getElementById('route-card').style.transform = 'translateY(0)';
                document.getElementById('bottom-hud').style.bottom = 'calc(max(24px, env(safe-area-inset-bottom, 24px)) + 190px)';
                isFollowing = true; updateGPSUI();
            } else { showToast("Route error"); }
        }

        function updateNavBanner(lat, lon) {
            if (currentRoutePath.length < 2) return;
            const dest = currentRoutePath[currentRoutePath.length - 1], dToD = getDistance(lat, lon, dest[0], dest[1]);
            if (dToD < 15) { document.getElementById('nav-arrow').textContent = '🎯'; document.getElementById('nav-instruction').textContent = 'Arrived!'; document.getElementById('nav-banner').style.display = 'flex'; return; }
            document.getElementById('nav-instruction').textContent = 'Follow path';
            document.getElementById('nav-distance').textContent = Math.round(dToD) + 'm';
            document.getElementById('nav-banner').style.display = 'flex';
        }

        function getBearing(la1, lo1, la2, lo2) { const f1 = la1 * Math.PI / 180, f2 = la2 * Math.PI / 180, dl = (lo2-lo1) * Math.PI / 180; const y = Math.sin(dl) * Math.cos(f2), x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl); return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360; }
        function getDistanceToSegment(px, py, x1, y1, x2, y2) { const l2 = Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2); if (l2 === 0) return getDistance(px, py, x1, y1); let t = Math.max(0, Math.min(1, ((px-x1)*(x2-x1)+(py-y1)*(y2-y1))/l2)); return getDistance(px, py, x1+t*(x2-x1), y1+t*(y2-y1)); }
        function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.opacity = '1'; clearTimeout(toastTimeout); toastTimeout = setTimeout(() => t.style.opacity = '0', 3000); }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', e => {
                if (e.data && e.data.type === 'TILE_CACHE_PROGRESS') {
                    const el = document.getElementById('tile-progress-bar');
                    if (el) { el.style.display = 'flex'; document.getElementById('tile-progress-pct').textContent = e.data.progress + '%'; if (e.data.progress >= 100) setTimeout(() => el.style.display = 'none', 2000); }
                }
            });
        }
        loadApp();
    </script>
</body>
